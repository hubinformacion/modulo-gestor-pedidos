<text x="84" y="926" class="eyebrow">RESPALDO MANUAL SEMANAL · FUERA DEL RUNTIME</text>
<text x="84" y="957" font-size="20" font-weight="550">PostgreSQL → exportación local cifrada → carpeta Drive exclusiva de respaldos. Clave custodiada aparte.</text>
<text x="84" y="983" class="small muted">Procedimiento definido; destino, cifrado y restauración por validar. No hay backup automático desplegado.</text>
