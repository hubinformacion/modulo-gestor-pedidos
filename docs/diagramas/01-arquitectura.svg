<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura completa · Fondo Editorial Continental</title>
<desc id="desc">El comprador usa compra y seguimiento Next.js embebidos en WordPress. Gestores y Tesorería entran directamente a Vercel, con identidad Google y autorización en PostgreSQL Neon. Los servicios de servidor gestionan pedidos, pagos, emisión y auditoría, archivos privados Drive y correo Gmail por evento, incluido aviso separado al apoyo para recojo sin acceso al sistema. Google Maps se consulta desde compra. GitHub entrega código a Vercel. El cron diario solo reconcilia permisos Drive; el respaldo semanal es manual, cifrado y separado del runtime.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#777083" stroke-width="1.5"/></marker></defs>
